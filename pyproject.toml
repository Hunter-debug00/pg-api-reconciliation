[project]
name = "pg-api-reconciliation"
version = "0.4.0"
description = "PostgreSQL 16 experiment comparing API reconciliation strategies under concurrent mutations"
readme = "README.md"
authors = [
    { name = "Hunter" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "tabulate>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
